[project]
name = "bot-as-shell"
version = "1.0.0"
description = "Natural language server management over Telegram via opencode CLI"
authors = [{name = "deuthe"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "python-telegram-bot>=22.0",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.scripts]
bot-as-shell-bot = "bot.bot:main"
