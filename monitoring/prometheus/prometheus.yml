global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: 'bot'
    static_configs:
      - targets: ['127.0.0.1:9101']

  - job_name: 'processes'
    static_configs:
      - targets: ['127.0.0.1:9256']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

rule_files:
  - {{DIR}}/monitoring/prometheus/alerts.yml
